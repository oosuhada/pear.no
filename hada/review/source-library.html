  <style>
    *{box-sizing:border-box}html,body{margin:0;background:#0b0b0b;color:#eee;font-family:Arial,Helvetica,sans-serif}body{min-height:100vh}.filters{position:sticky;top:0;z-index:20;display:flex;align-items:center;padding:14px 18px 12px;overflow:hidden;background:rgba(11,11,11,.94);backdrop-filter:blur(16px);border-bottom:1px solid rgba(255,255,255,.07)}.filter-strip{min-width:0;flex:1;display:flex;align-items:center;gap:18px;overflow-x:auto;scrollbar-width:none}.filter-strip::-webkit-scrollbar{display:none}.filter{flex:0 0 auto;padding:0 0 4px;border:0;border-bottom:1px solid transparent;background:none;color:rgba(255,255,255,.4);font:500 10px/1 ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono",monospace;letter-spacing:.11em;text-transform:uppercase;white-space:nowrap;cursor:pointer;transition:color .2s ease,border-color .2s ease}.filter b{margin-left:6px;font-weight:500;color:rgba(255,255,255,.24)}.filter:hover,.filter:focus-visible{color:rgba(255,255,255,.78);outline:none}.filter.active{color:#fff;border-color:rgba(255,255,255,.72)}.filter.active b{color:rgba(255,255,255,.55)}.gallery{padding:10px 18px 18px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.tile{position:relative;display:block;aspect-ratio:16/9;overflow:hidden;background:#181818;color:inherit;text-decoration:none;border:0;isolation:isolate}.tile::after{content:"";position:absolute;inset:0;z-index:1;background:radial-gradient(circle at 50% 44%,rgba(0,0,0,.14),rgba(0,0,0,.72));box-shadow:inset 0 0 72px rgba(0,0,0,.72);opacity:0;transition:opacity .3s ease}.tile img,.tile-preview{width:100%;height:100%;object-fit:cover;object-position:center center;display:block;transition:filter .32s ease}.tile-preview{position:absolute;inset:0;z-index:0;opacity:0;transition:opacity .2s ease,filter .32s ease;pointer-events:none}.tile.previewing .tile-preview{opacity:1}.tile:hover img,.tile:hover .tile-preview,.tile:focus-visible img,.tile:focus-visible .tile-preview{filter:brightness(.5) contrast(1.06) saturate(.84)}.tile:hover::after,.tile:focus-visible::after{opacity:1}.n{position:absolute;z-index:3;left:12px;top:10px;font:11px/1 ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono",monospace;letter-spacing:.08em;text-shadow:0 1px 8px #000}.tile-title{position:absolute;z-index:3;left:50%;top:50%;transform:translate(-50%,-50%);margin:0;opacity:0;font:500 clamp(12px,1.15vw,16px)/1 ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono",monospace;letter-spacing:.18em;text-transform:uppercase;text-shadow:0 2px 18px rgba(0,0,0,.82);transition:opacity .24s ease;pointer-events:none;white-space:nowrap}.tile:hover .tile-title,.tile:focus-visible .tile-title{opacity:1}.detail{display:none}.detail.active{display:block;min-height:720vh}.film{position:fixed;inset:0;background:#000;overflow:hidden}.film video{width:100%;height:100%;object-fit:cover;display:block}.back{position:fixed;z-index:6;left:18px;top:18px;border:0;background:rgba(0,0,0,.45);color:#fff;padding:10px 12px;font:11px/1 ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono",monospace;text-decoration:none;backdrop-filter:blur(8px)}.counter{position:fixed;z-index:6;right:18px;top:18px;font:11px/1 ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono",monospace;text-shadow:0 1px 8px #000}.progress{position:fixed;z-index:3;left:18px;right:18px;bottom:18px;height:1px;background:rgba(255,255,255,.25)}.progress i{display:block;height:100%;width:0;background:#fff}.error{display:none;position:fixed;inset:0;z-index:5;place-items:center;background:#111;font:12px ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono",monospace}.error.show{display:grid}@media(max-width:1020px){.gallery{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:560px){.filters{padding:12px 10px 10px}.filter-strip{gap:14px}.gallery{grid-template-columns:1fr;padding:8px 10px 10px}.tile-title{font-size:13px}}
  </style>
  <style>
    .search-toggle,.search-close{flex:0 0 auto;width:34px;height:28px;display:grid;place-items:center;border:0;background:#0b0b0b;color:rgba(255,255,255,.62);cursor:pointer;padding:0}.search-toggle{margin-left:12px;position:relative;z-index:2;box-shadow:-14px 0 18px #0b0b0b}.search-toggle:hover,.search-toggle:focus-visible,.search-close:hover,.search-close:focus-visible{color:#fff;outline:none}.search-toggle svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.5}.search-shell{display:flex;align-items:center;width:100%;gap:10px}.search-mark{flex:0 0 auto;width:15px;height:15px;fill:none;stroke:rgba(255,255,255,.48);stroke-width:1.5}.archive-search{min-width:0;flex:1;border:0;outline:0;background:transparent;color:#fff;font:500 11px/1.2 ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono",monospace;letter-spacing:.08em}.archive-search::placeholder{color:rgba(255,255,255,.28)}.search-empty{grid-column:1/-1;min-height:35vh;display:grid;place-items:center;color:rgba(255,255,255,.34);font:500 11px/1 ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono",monospace;letter-spacing:.12em;text-transform:uppercase}
  </style>
</head>
<body>
  <nav id="filters" class="filters" aria-label="Archive filters"></nav>
  <main id="gallery" class="gallery"></main>
  <section id="detail" class="detail">
    <div class="film"><video id="video" muted playsinline preload="auto"></video></div>
    <div class="archive-intro" aria-hidden="true">
      <div id="archiveTitle" class="archive-title"></div>
      <div id="archiveReflection" class="archive-title-reflection"></div>
      <i class="motif motif-a"></i>
      <i class="motif motif-b"></i>
      <i class="motif motif-c"></i>
    </div>
    <div class="archive-outro" aria-hidden="true">
      <div id="archiveOutroTitle" class="archive-outro-title"></div>
      <div class="archive-outro-label">OOSUHADA ARCHIVE</div>
      <div class="archive-outro-url">oosu.dev</div>
    </div>
    <a class="back" href="source-library.html">←</a>

  </section>
  <div id="error" class="error">MEDIA ERROR</div>
  <script src="source-library-data.js"></script>
  <script src="source-library-youtube-data.js"></script>
  <script>
    const root='../reference/source-library-v1/';
    const items=window.SOURCE_LIBRARY||[];
    const params=new URLSearchParams(location.search);
    const selected=params.get('clip');
    const gallery=document.querySelector('#gallery');
    const filters=document.querySelector('#filters');
    const detail=document.querySelector('#detail');
    const video=document.querySelector('#video');
    const bar=document.querySelector('#bar');
    const counter=document.querySelector('#counter');
    const error=document.querySelector('#error');
    const archiveTitle=document.querySelector('#archiveTitle');
    const archiveReflection=document.querySelector('#archiveReflection');
    const archiveOutroTitle=document.querySelector('#archiveOutroTitle');
    const filterDefs=['ALL','Apple','Food','Nature','Experimental','Cosmos','Water','Business','People','Travel','Sport'];
    const cosmosIds=new Set(['12','13','25','111','112','138','140']);
    const categoryAliases={
      'Food / Drink':'Food','Nature / Land':'Nature','Experimental / Material / Object':'Experimental',
      'Sky / Space / Weather':'Nature','Water':'Water','Work / Tech':'Business','People / Culture':'People',
      'Travel / City / Architecture':'Travel','Sport / Physical':'Sport'
    };
    const categoryFor=item=>cosmosIds.has(item.id)?'Cosmos':(categoryAliases[item.category]||item.category||'Experimental');
    let activeFilter=params.get('filter')||'ALL';
    let searchMode=params.has('q');
    let searchQuery=params.get('q')||'';
    let orderedItems=[];
    function seededShuffle(list,seed=20260829){
      const out=[...list];let s=seed>>>0;
      const random=()=>{s=(s+0x6D2B79F5)>>>0;let t=s;t=Math.imul(t^(t>>>15),t|1);t^=t+Math.imul(t^(t>>>7),t|61);return((t^(t>>>14))>>>0)/4294967296};
      for(let i=out.length-1;i>0;i--){const j=Math.floor(random()*(i+1));[out[i],out[j]]=[out[j],out[i]]}
      return out;
    }
    function assignPublicIds(){
      const stable=[...items].sort((a,b)=>Number(a.id)-Number(b.id));
      stable.filter(item=>Number(item.id)<15).forEach(item=>item.publicId=item.id);
      // Preserve the established 15–238 public numbering even as new archive
      // records are appended. New records receive their own appended IDs.
      const legacyPool=stable.filter(item=>Number(item.id)>=15&&Number(item.id)<=238);
      const shuffledNumbers=seededShuffle(legacyPool.map((_,index)=>String(index+15).padStart(2,'0')),20260829);
      legacyPool.forEach((item,index)=>item.publicId=shuffledNumbers[index]);
      const peopleByCurrentNumber=legacyPool
        .filter(item=>categoryFor(item)==='People')
        .sort((a,b)=>Number(a.publicId)-Number(b.publicId));
      const peopleNumbers=peopleByCurrentNumber.map(item=>item.publicId);
      peopleByCurrentNumber.forEach((item,index)=>item.publicId=peopleNumbers[peopleNumbers.length-1-index]);
      stable.filter(item=>Number(item.id)>238).forEach(item=>item.publicId=String(item.id));
      const publicIdSwaps=new Map([
        ['271','37'],['186','271'],
        ['272','91'],['24','272'],
        ['273','158'],['17','273'],
        ['274','229'],['107','274']
      ]);
      stable.forEach(item=>{if(publicIdSwaps.has(item.id))item.publicId=publicIdSwaps.get(item.id)});
      orderedItems=[...items].sort((a,b)=>Number(a.publicId)-Number(b.publicId));
    }
    const genericKeywords='archive video film footage cinematic motion visual scene aesthetic'.split(' ');
    const categoryKeywords={
      Food:'food drink beverage dining cuisine cooking restaurant cafe coffee tea matcha wine fruit meal kitchen hospitality',
      Nature:'nature landscape outdoor forest mountain alpine weather sky cloud sunrise sunset snow autumn desert field plant animal wildlife environment',
      Experimental:'experimental abstract texture material object analog macro light shadow bokeh art visual pattern cinematic atmosphere',
      Cosmos:'space cosmos astronomy galaxy moon earth stars universe celestial orbit planet blackhole spacecraft',
      Water:'water ocean sea beach wave coast rain waterfall drop underwater reef blue marine shoreline',
      Business:'business work office technology tech corporate startup ai chatgpt presentation computer screen digital productivity professional',
      Apple:'apple iphone mac macbook airpods watch homepod pencil intelligence creator studio card product technology device hardware design ecosystem',
      People:'people culture human family lifestyle relationship community emotion portrait art music dance creator everyday life',
      Travel:'travel city architecture tourism destination airport airplane hotel train street urban building journey',
      Sport:'sport fitness gym exercise workout training running boxing athlete wellness physical movement strength cardio'
    };
    const keywordRules=[
      [/museum|gallery|painter|painting/i,'museum gallery art artwork exhibition culture architecture design artist painting japanese tokyo'],
      [/film|video|cinematic|videographer/i,'filmmaking filmmaker camera cinematography director production shooting creator lens'],
      [/cat|dog/i,'animal pet companion cute domestic wildlife mammal'],
      [/coffee|espresso|tea|matcha/i,'coffee tea cafe beverage drink brewing cup ritual caffeine'],
      [/food|cooking|restaurant|buffet|plating|salad|burger|baguette|orange|grape|wine/i,'food cuisine culinary restaurant dining ingredient chef hospitality'],
      [/moon|galaxy|earth|black hole|spaceship|life/i,'space astronomy cosmos celestial moon stars galaxy universe orbit'],
      [/gym|workout|exercise|lifting|rope|fitness|boxing|running|marathon|ball|wellness/i,'sport fitness exercise gym training athlete physical strength cardio health'],
      [/family|baby|father|son|bonding|birthday|party|people|walking|dreamer|morning/i,'people family lifestyle relationship emotion together human everyday portrait'],
      [/airport|departure|airplane|jet|train|japan|sydney|egypt|pakistan|montreal|eiffel|hotel|skyscraper|bustling/i,'travel city destination tourism urban architecture journey transport street'],
      [/water|ocean|coast|beach|wave|rain|waterfall|drop|current/i,'water ocean sea wave rain coast beach marine liquid blue'],
      [/forest|alpine|blossom|cliff|pine|misty|field|sunrise|sunset|snow|autumn|desert|cloud|aurora/i,'nature landscape outdoors weather season sky environment mountain'],
      [/office|business|corporate|startup|chatgpt|scrolling|ideas|presentation/i,'business work technology office digital professional corporate productivity screen'],
      [/apple|iphone|macbook|mac students|mac mini|airpods|homepod|pencil|creator studio/i,'apple iphone mac macbook airpods watch homepod pencil intelligence creator studio product hardware device ecosystem cupertino'],
      [/vinyl|old tv|time|eye|ink|lava|bokeh|shadow|glow|hourglass|abstract|toothbrush/i,'experimental object analog texture abstract material macro visual art'],
      [/cell|virus|bacteria/i,'science biology microscopic microscope organism cellular laboratory research'],
      [/mars|saturn|jupiter|asteroid|astronaut|solar|star|space/i,'space astronomy cosmos planet solar system stars universe nasa celestial'],
      [/actor|dancer|ballerina|concert|model|headphone/i,'people performance music stage dance fashion entertainment artist'],
      [/superhero|cape/i,'people child kid childhood superhero hero imagination play family outdoor'],
      [/\bvr\b|iphone|airpods|apple|mac students/i,'technology tech apple device hardware smartphone phone mobile computer mac audio headphones vr virtual reality product design'],
      [/capybara/i,'nature animal wildlife mammal capybara family cute']
    ];
    function keywordsFor(item){
      const title=item.title.toLowerCase();
      const category=categoryFor(item);
      const customKeywords=Array.isArray(item.keywords)?item.keywords.flatMap(keyword=>String(keyword).toLowerCase().split(/[^a-z0-9]+/).filter(Boolean)):[];
      const words=[...genericKeywords,...(categoryKeywords[category]||'').split(' '),...title.split(/[^a-z0-9]+/).filter(Boolean),...customKeywords];
      keywordRules.forEach(([rule,terms])=>{if(rule.test(title))words.push(...terms.split(' '))});
      return [...new Set(words.filter(Boolean))];
    }
    function searchScore(item,query){
      const normalized=query.trim().toLowerCase();if(!normalized)return 1;
      const tokens=normalized.split(/\s+/).filter(Boolean);
      const title=item.title.toLowerCase();
      const category=categoryFor(item).toLowerCase();
      const keywords=keywordsFor(item);
      let total=0;
      for(const token of tokens){
        let score=0;
        if(String(Number(item.publicId))===token||item.publicId===token)score=Math.max(score,130);
        if(title===token)score=Math.max(score,120);
        else if(title.startsWith(token))score=Math.max(score,90);
        else if(title.includes(token))score=Math.max(score,70);
        if(token==='museum'&&title.includes('gallery'))score=Math.max(score,82);
        if(token==='gallery'&&title.includes('museum'))score=Math.max(score,82);
        if(category===token)score=Math.max(score,55);else if(category.includes(token))score=Math.max(score,34);
        for(const keyword of keywords){if(keyword===token)score=Math.max(score,48);else if(keyword.startsWith(token))score=Math.max(score,34);else if(keyword.includes(token))score=Math.max(score,18)}
        if(!score)return 0;total+=score;
      }
      return total;
    }
    const searchIcon='<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"></circle><path d="M15.5 15.5 21 21"></path></svg>';
    function renderTopbar(){
      if(searchMode){
        filters.innerHTML=`<div class="search-shell">${searchIcon.replace('<svg','<svg class="search-mark"')}<input id="archiveSearch" class="archive-search" type="search" autocomplete="off" spellcheck="false" placeholder="SEARCH ARCHIVE" value="${searchQuery.replace(/&/g,'&amp;').replace(/"/g,'&quot;')}"><button class="search-close" type="button" aria-label="Close search">×</button></div>`;
        const input=filters.querySelector('#archiveSearch');
        input.addEventListener('input',()=>{searchQuery=input.value;const url=new URL(location.href);url.searchParams.set('q',searchQuery);url.searchParams.delete('filter');history.replaceState(null,'',url);renderGallery()});
        input.addEventListener('keydown',event=>{if(event.key==='Escape')closeSearch()});
        filters.querySelector('.search-close').addEventListener('click',closeSearch);
        requestAnimationFrame(()=>input.focus({preventScroll:true}));
        return;
      }
      filters.innerHTML=`<div class="filter-strip">${filterDefs.map(key=>{
        const count=key==='ALL'?items.length:items.filter(x=>categoryFor(x)===key).length;
        const label=key==='ALL'?'All':key;
        return `<button class="filter${activeFilter===key?' active':''}" type="button" data-filter="${key}">${label}<b>${count}</b></button>`;
      }).join('')}</div><button class="search-toggle" type="button" aria-label="Search archive">${searchIcon}</button>`;
      filters.querySelectorAll('.filter').forEach(button=>button.addEventListener('click',()=>{
        activeFilter=button.dataset.filter;
        const url=new URL(location.href);if(activeFilter==='ALL')url.searchParams.delete('filter');else url.searchParams.set('filter',activeFilter);history.replaceState(null,'',url);
        renderTopbar();renderGallery();scrollTo(0,0);
      }));
      filters.querySelector('.search-toggle').addEventListener('click',()=>{searchMode=true;searchQuery='';const url=new URL(location.href);url.searchParams.delete('filter');url.searchParams.set('q','');history.replaceState(null,'',url);renderTopbar();renderGallery()});
    }
    function closeSearch(){
      searchMode=false;searchQuery='';const url=new URL(location.href);url.searchParams.delete('q');if(activeFilter!=='ALL')url.searchParams.set('filter',activeFilter);history.replaceState(null,'',url);renderTopbar();renderGallery();
    }
    function renderGallery(){
      let visible;
      if(searchMode&&searchQuery.trim()){
        visible=orderedItems.map(item=>({item,score:searchScore(item,searchQuery)})).filter(result=>result.score>0).sort((a,b)=>b.score-a.score||Number(a.item.publicId)-Number(b.item.publicId)).map(result=>result.item);
      }else visible=activeFilter==='ALL'||searchMode?orderedItems:orderedItems.filter(item=>categoryFor(item)===activeFilter);
      const contextQuery=searchMode?`&q=${encodeURIComponent(searchQuery)}`:activeFilter==='ALL'?'':`&filter=${encodeURIComponent(activeFilter)}`;
      gallery.innerHTML=visible.length?visible.map(item=>`<a class="tile" href="?clip=${item.publicId}${contextQuery}" aria-label="${item.publicId} ${item.title}" data-preview="${root}media/${item.clip}"><img src="${root}thumbs/${item.thumb}" alt=""><video class="tile-preview" muted playsinline loop preload="none"></video><span class="n">${item.publicId}</span><span class="tile-title">${item.title}</span></a>`).join(''):'<div class="search-empty">NO MATCHES</div>';
      if(matchMedia('(hover:hover) and (pointer:fine)').matches){
        let active=null;
        const stop=tile=>{
          if(!tile)return;
          const preview=tile.querySelector('.tile-preview');
          preview.pause();
          tile.classList.remove('previewing');
          try{preview.currentTime=0}catch{}
          if(active===tile)active=null;
        };
        gallery.querySelectorAll('.tile').forEach(tile=>{
          const preview=tile.querySelector('.tile-preview');
          preview.addEventListener('playing',()=>tile.classList.add('previewing'));
          tile.addEventListener('mouseenter',()=>{
            if(active&&active!==tile)stop(active);
            active=tile;
            if(!preview.src)preview.src=tile.dataset.preview;
            try{preview.currentTime=0}catch{}
            preview.play().catch(()=>{});
          });
          tile.addEventListener('mouseleave',()=>stop(tile));
        });
      }
    }
    async function prepareGallery(){
      try{
        const [response,overridesResponse]=await Promise.all([
          fetch('../../scripts/hada/youtube-archive-manifest.json',{cache:'no-store'}),
          fetch('../../scripts/hada/youtube-archive-manifest-overrides.json',{cache:'no-store'})
        ]);
        if(response.ok){
          const manifest=await response.json();
          const overrides=overridesResponse.ok?await overridesResponse.json():[];
          const overrideById=new Map(overrides.map(x=>[x.id,x]));
          const merged=manifest.map(x=>({...x,...(overrideById.get(x.id)||{})}));
          overrides.forEach(x=>{if(!manifest.some(base=>base.id===x.id))merged.push(x)});
          const metaById=new Map(merged.map(x=>[x.id,x]));
          items.forEach(item=>{
            const meta=metaById.get(item.id);
            if(!meta)return;
            if(meta.category)item.category=meta.category;
            if(Array.isArray(meta.keywords))item.keywords=meta.keywords;
          });
        }
      }catch{}
      if(!filterDefs.includes(activeFilter))activeFilter='ALL';
      renderTopbar();renderGallery();
    }
    assignPublicIds();
    if(!selected){prepareGallery()}else{
      const item=items.find(x=>x.publicId===selected);
      if(!item){location.replace('source-library.html')}else{
        gallery.style.display='none';filters.style.display='none';
        const returnFilter=params.get('filter');
        const returnQuery=params.get('q');
        document.querySelector('.back').href=returnQuery!==null?`source-library.html?q=${encodeURIComponent(returnQuery)}`:returnFilter?`source-library.html?filter=${encodeURIComponent(returnFilter)}`:'source-library.html';
        const itemCategory=categoryFor(item);
        detail.classList.add('active',`theme-${item.theme || item.id}`,`clip-${item.id}`,`category-${itemCategory.toLowerCase().replace(/[^a-z0-9]+/g,'-')}`);
        counter.textContent=`${item.publicId} / ${String(items.length).padStart(2,'0')}`;
        archiveTitle.textContent=item.title;
        archiveReflection.textContent=item.title;
        archiveOutroTitle.textContent=item.title;
        video.muted=true;
        video.playsInline=true;
        video.setAttribute('playsinline','');
        video.setAttribute('webkit-playsinline','');
        video.preload='auto';
        video.src=`${root}media/${item.clip}`;
        let duration=1,target=0,ready=false,primed=false,seekTimer=0,seekRaf=0,lastSeekAt=0,pendingSeek=false;
        const clamp=v=>Math.max(0,Math.min(1,v));
        const seekInterval=95;
        const performSeek=()=>{
          seekRaf=0;
          if(!ready)return;
          if(video.seeking){pendingSeek=true;return}
          if(Math.abs(video.currentTime-target)<.045)return;
          const wait=seekInterval-(performance.now()-lastSeekAt);
          if(wait>0){clearTimeout(seekTimer);seekTimer=setTimeout(scheduleSeek,wait);return}
          lastSeekAt=performance.now();pendingSeek=false;
          try{
            if(typeof video.fastSeek==='function')video.fastSeek(target);
            else video.currentTime=target;
          }catch{pendingSeek=true;clearTimeout(seekTimer);seekTimer=setTimeout(scheduleSeek,160)}
        };
        const scheduleSeek=()=>{if(!seekRaf)seekRaf=requestAnimationFrame(performSeek)};
        const primeVideo=()=>{
          if(primed)return;primed=true;
          const attempt=video.play();
          if(attempt&&typeof attempt.then==='function')attempt.then(()=>{video.pause();scheduleSeek()}).catch(()=>{});
          else{video.pause();scheduleSeek()}
        };
        function update(){
          const max=Math.max(1,document.documentElement.scrollHeight-innerHeight),p=clamp(scrollY/max);
          const isApple=itemCategory==='Apple';
          const intro=clamp(p/.11),introOut=clamp((p-.075)/.075);
          const filmP=isApple?clamp((p-.13)/.77):clamp(p/.9);
          const appleFilm=isApple?clamp((p-.13)/.045):1;
          const outro=clamp((p-.925)/.055);
          const outroText=clamp((p-.955)/.035);
          target=filmP*Math.max(.01,duration-.04);
          detail.style.setProperty('--p',p.toFixed(4));
          detail.style.setProperty('--intro',intro.toFixed(4));
          detail.style.setProperty('--intro-out',introOut.toFixed(4));
          detail.style.setProperty('--apple-film',appleFilm.toFixed(4));
          detail.style.setProperty('--outro',outro.toFixed(4));
          detail.style.setProperty('--outro-text',outroText.toFixed(4));
          bar.style.width=`${(p*100).toFixed(2)}%`;
          primeVideo();scheduleSeek();
        }
        video.addEventListener('loadedmetadata',()=>{
          duration=video.duration||1;
          const scrollHeight=item.scrollHeightVh ?? Math.round(Math.max(720,Math.min(3600,duration*30)));
          detail.style.minHeight=`${scrollHeight}vh`;
          video.pause();ready=true;scrollTo(0,0);update();
        });
        video.addEventListener('seeked',()=>{if(pendingSeek||Math.abs(video.currentTime-target)>.08)scheduleSeek()});
        video.addEventListener('canplay',scheduleSeek);
        video.addEventListener('error',()=>error.classList.add('show'));
        addEventListener('scroll',update,{passive:true});addEventListener('resize',update);
        ['touchstart','pointerdown','wheel'].forEach(type=>addEventListener(type,primeVideo,{once:true,passive:true}));
        video.load();
      }
    }
  </script>
</body>
</html>
